<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Imports Tailwind CSS via CDN for styling the page without a separate CSS file -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>School Reg</title>
</head>

<body>

    <div class="border lg:w-[30%] sm:w-[50%] rounded-sm mx-auto mt-10 p-5">
        <div>
            <h3 class="text-center mb-4 text-blue-500 text-3xl font-bold">Student Biodata</h3>
            <!-- Form Title -->
            <h3 class="text-center mb-4 underline text-2xl">Registration</h3>
            <form>
                <!-- First Name Input Section -->
                <div>
                    <label for="fname">First Name</label><br>
                    <input
                        class="border p-1 w-full focus:rounded-md duration-500 ease-in-out outline-none focus:border-green-500 mb-3"
                        type="text" id="fname" name="fname"><br>
                    <!-- Empty span to display error message if validation fails -->
                    <span id="fNameErr"></span>
                </div>
                
                <!-- Last Name Input Section -->
                <div>
                    <label for="lname">Last Name</label><br>
                    <input
                        class="border p-1 w-full focus:rounded-md duration-500 ease-in-out outline-none focus:border-green-500 mb-3"
                        type="text" id="lname" name="lname"><br>
                    <span id="lNameErr"></span>
                </div>
                
                <!-- Email Input Section -->
                <div>
                    <label for="email">Email</label><br>
                    <input
                        class="border p-1 w-full focus:rounded-md duration-500 ease-in-out outline-none focus:border-green-500 mb-3"
                        type="text" id="email" name="email"><br>
                    <span id="emailErr"></span>
                </div>
                
                <!-- Phone Number Input Section -->
                <div>
                    <label for="phone">Phone No</label><br>
                    <input
                        class="border p-1 w-full focus:rounded-md duration-500 ease-in-out outline-none focus:border-green-500 mb-3"
                        type="text" id="phone" name="phone"><br>
                    <span id="phoneErr"></span>
                </div>

                <!-- Matric Number Input Section -->
                <div>
                    <label for="matric">Matric No</label><br>
                    <input
                        class="border p-1 w-full focus:rounded-md duration-500 ease-in-out outline-none focus:border-green-500 mb-3"
                        type="text" id="matric" name="matric" placeholder="VUG/SEN/24/12878"><br>
                    <span id="matricErr"></span>
                </div>
                
                <!-- Department Dropdown Section -->
                <div>
                    <label for="department">Department</label><br>
                    <select name="department" id="department"
                        class=" text-center border p-1 w-full focus:rounded-md duration-500 ease-in-out outline-none focus:border-green-500 mb-3">
                        <option class="text-left" value="">Select</option>
                        <option class="text-left" value="software">Software Engineering</option>
                        <option class="text-left" value="computer">Computer Science</option>
                        <option class="text-left" value="engineering">Computer Engineering</option>
                        <option class="text-left" value="law">Law</option>
                        <option class="text-left" value="history">History</option>
                        <option class="text-left" value="medicine">Medicine</option>
                    </select><br>
                    <span id="departmentErr"></span>
                </div>
                
                <!-- Level Input Section -->
                <div class="mb-4">
                    <label for="level">Level</label><br>
                    <input
                        class="border p-1 w-full focus:rounded-md duration-500 ease-in-out outline-none focus:border-green-500 mb-3"
                        type="number" id="level" name="level" min="100" max="600" step="100"><br>
                    <span id="levelErr"></span>
                </div>
                
                <!-- Submit Button -->
                <div class="mb-5">
                    <button class="border p-1 w-full bg-blue-700 rounded-md text-white hover:bg-blue-800"
                        id="btn">Submit</button><br>
                </div>
                
                <!-- Empty div where the success message will be injected by JavaScript -->
                <div id="display">
                </div>
            </form>
        </div>
    </div>
</body>
<!-- Links the external JavaScript file to run the form logic -->
<script src="script.js"></script>

</html>
